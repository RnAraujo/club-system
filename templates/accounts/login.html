{% extends 'base.html' %}
{% block title %}Iniciar sesión{% endblock %}
{% block content %}
<div class="max-w-md mx-auto card mt-10">
  <h1 class="text-2xl font-bold text-center mb-6">Iniciar sesión</h1>
  <form method="post" class="space-y-4">
    {% csrf_token %}
    {{ form.as_p }}
    <button
        type="submit"
        class="mt-6 w-full rounded-lg bg-blue-600 px-5 py-2.5 font-semibold text-white shadow-sm transition-colors hover:bg-blue-700 focus:outline-none focus:ring-4 focus:ring-blue-300">
        Iniciar sesión
    </button>
  </form>
  <p class="text-center text-sm text-gray-600 mt-4">
    ¿No tienes cuenta?
    <a href="{% url 'accounts:register' %}" class="text-blue-600 hover:underline">Regístrate</a>
  </p>
</div>
{% endblock %}
